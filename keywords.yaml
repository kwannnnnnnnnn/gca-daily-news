# 경기콘텐츠진흥원(GCA) 일일 언론 모니터링 — 키워드/필터 설정
# 이 파일만 고치면 수집 대상·노이즈 규칙·노출 순서를 바꿀 수 있습니다.

settings:
  hours_window: 30          # 최근 N시간 안에 나온 기사만 유지
  naver_display: 100        # 네이버 API 키워드당 최대 수집 건수(최대 100)
  min_title_similarity: 0.60  # 제목 유사도 이 값 이상이면 같은 사건으로 통합
  max_items_per_group: 40   # 그룹별 최대 보관 건수
  preview_items: 5          # 그룹별 기본 노출 개수(나머지는 '더보기'로 접힘)
  lead_window: 25           # lead_any 인식 범위(요약 앞 N자). 넓힐수록 회수↑·co주최 노이즈↑
  retention_days: 365       # 이 기간 지난 아카이브(archive/*.html·data/*.json)는 자동 삭제(0=무제한)

  # ────────────────────────────────────────────────────────────────
  # ★★★ 선거 표현 필터 ★★★
  # true  = '추미애 …후보/경선/당선인' 옛 선거기사 재발행분을 차단(경기도지사 그룹).
  # false = 선거 표현을 거르지 않음 → 선거 기사를 절대 놓치지 않음(옛 재발행분이 가끔 섞일 수 있음).
  #         (사용자 선택으로 상시 false 유지 중 — 선거철에도 이대로 두면 됨)
  filter_old_election_terms: false
  old_election_terms: [지사 후보, 후보 시절, 경선, 당선인, 예비후보]
  # ────────────────────────────────────────────────────────────────

# 모든 그룹 공통 제외어(제목/요약에 있으면 버림) — 증권·광고성·공지 노이즈 차단
global_exclude:
  - 코스피
  - 코스닥
  - 상한가
  - 하한가
  - 급등주
  - 부고
  - 운세
  - 로또
  - 분양가
  - 오늘의 날씨
  - "포토]"
  - 홍보대사
  - 화보
  - "[알림]"
  - 저작권 고지
  - 집값
  - 빅테크 벨트
  - 특징주

# priority = 화면 노출 순서(작을수록 위/왼쪽)
# spec     = 배정 정밀도 등급(작을수록 '특정 기관'). 한 기사가 여러 그룹에 걸리면
#            spec이 낮은(더 특정한) 그룹으로 배정 → 광역분류가 기관기사 흡수 방지
# 관련도(주제) 게이트 — 그룹에 정의된 것 중 하나만 충족하면 인정:
#   require_any  : 제목/요약 아무 데나 이 중 하나(내용 게이트)
#   title_any    : 제목(헤드라인)에 이 중 하나(엔티티 정밀도)
#   lead_any     : 기사 도입부(요약 앞 14자)에 이 중 하나 → 제목에 기관명 없어도 '주체'면 인정(사업명 제목 회수)
#   title_all_of : 제목에 각 하위목록에서 하나씩 '모두'(예: 경기지역 AND 콘텐츠)
#   exclude      : 이 단어가 있으면 그 그룹에선 제외
groups:
  - id: gca
    label: 경기콘텐츠진흥원
    priority: 1
    spec: 1
    queries: [경기콘텐츠진흥원, 경콘진]
    # 기사 도입부가 경콘진이면 제목에 이름 없어도 인정(레벨업 등 사업명 제목 회수),
    # 단 'A가 주최하고 …경콘진이 주관' 식 co-언급은 도입부 밖이라 배제됨
    lead_any: [경기콘텐츠진흥원, 경콘진]
    # 기관명 + 경콘진 사업 브랜드(제목에 기관명이 없어도 사업명이면 인정)
    title_any: [경기콘텐츠진흥원, 경콘진, 경기문화창조허브, 문화창조허브, 경기게임아카데미,
                경기콘텐츠코리아랩, 경기영상위원회, GCON, PLAY GCA,
                경기인디시네마, 경기인디뮤직페스티벌, 경기 인디, 레벨업 펀드, 조각투자]

  - id: province
    label: 경기도(콘텐츠 관련)
    priority: 2
    spec: 5                  # 광역 catch-all
    queries: [경기도 콘텐츠, 경기 콘텐츠산업, 경기 게임산업, 판교 게임, 경기 웹툰, 경기도 웹툰, 경기도 메타버스, 경기 영상산업, 경기 애니메이션]
    # '경기'는 축구경기·경기침체 등 중의성이 있어 스포츠/타지역 맥락을 제외로 차단
    exclude: [경기장, 홈경기, 원정, 축구, 야구, KBO, 프로야구, 월드컵, 잠재성장률, 레알,
              서귀포, 제주, 강원, 전남, 전북, 충남, 충북, 경남, 경북]
    lead_any: [경기도]        # 도입부가 '경기도…'면 제목에 지역명 없어도 인정(회수율↑)
    # 제목에 (경기 지역) AND (콘텐츠 실체) 둘 다 → 부동산·경제·창업교육 노이즈 제거
    title_all_of:
      - [경기, 판교, 성남, 수원, 파주, 고양, 용인, 화성, 안양, 남양주, 광명, 안산, 평택, 시흥, 김포, 의정부]
      - [콘텐츠, 게임, 웹툰, 웹소설, 만화, 애니, 애니메이션, 영화, 영상, 미디어아트, 미디어, 음악, 공연, 방송, e스포츠, 이스포츠, 메타버스, OTT, 문화산업, 창작, 캐릭터]

  - id: governor
    label: 경기도지사
    priority: 3
    spec: 3
    queries: [추미애]
    title_any: [추미애, 경기도지사, 경기지사, 도지사]
    lead_any: [추미애, 경기도지사]   # 도입부가 추미애/도지사면 제목에 없어도 인정
    require_any: [경기도, 도지사, 도정, 경기도청, 경기지사, 민선, 경기도민]

  - id: gg_council
    label: 경기도의회(문체·미래위)
    priority: 4
    spec: 2                  # 특정 기관 — 광역/도지사보다 우선 배정
    # 경콘진 소관 상임위(문화체육관광위·미래과학협력위)·경콘진/콘텐츠 관련만
    queries: [경기도의회, 경기도의회 문화체육관광위원회, 경기도의회 미래과학협력위원회, 경기콘텐츠진흥원 경기도의회]
    # 위원회명은 title_any에서 제외(타 지역 의회 오매칭 방지) — '경기도의회'가 제목/도입부에 있어야
    title_any: [경기도의회, 경기도의원, 경기의회, 도의회, 도의원]
    lead_any: [경기도의회]
    exclude: [서울시의회, 부산시의회, 인천시의회, 대구시의회, 대전시의회, 광주시의회, 울산시의회, 세종시의회]
    require_any: [문화체육관광위원회, 문체위, 문화체육관광위, 미래과학협력위원회, 미래위, 미래과학협력위, 경기콘텐츠진흥원, 경콘진, 콘텐츠, 게임, 웹툰, 웹소설, 만화, 애니메이션, 영상산업, e스포츠, 콘텐츠산업, 다큐멘터리영화제]

  - id: bucheon
    label: 부천시(콘텐츠 관련)
    priority: 5
    spec: 4
    queries: [부천시, 조용익, 부천 웹툰, 부천 만화, 부천국제판타스틱영화제, 부천 문화도시]
    title_any: [부천, 조용익, BIFAN, 부천국제, 부천판타스틱, 한국만화영상진흥원, 만화영상진흥원]
    require_any: [콘텐츠, 웹툰, 웹소설, 만화, 애니, 게임, 영화, 영화제, 축제, 부천국제, BIFAN, 만화영상진흥원, 문화도시, 문화산업, 콘텐츠기업]

  - id: bucheon_council
    label: 부천시의회(재정문화위)
    priority: 6
    spec: 2                  # 특정 기관 — 부천시(광역)보다 우선 배정
    # 재정문화위원회(문화·콘텐츠 소관)·경콘진/부천 콘텐츠기관 관련만
    queries: [부천시의회, 부천시의회 재정문화위원회]
    title_any: [부천시의회, 부천시의원, 부천 시의회, 재정문화위원회]
    lead_any: [부천시의회, 재정문화위원회]
    require_any: [재정문화위원회, 재정문화위, 재정위, 경기콘텐츠진흥원, 경콘진, 한국만화영상진흥원, 만화영상진흥원, 콘텐츠, 웹툰, 만화, 애니, 영화, BIFAN, 부천국제, 문화산업, 문화도시]

  - id: central
    label: 중앙부처(콘텐츠)
    priority: 7
    spec: 5
    queries: [한국콘텐츠진흥원, 콘진원, 문화체육관광부 콘텐츠, 콘텐츠산업 진흥, 게임산업 진흥, 콘텐츠 정책, 저작권 콘텐츠]
    # 콘텐츠 전담기관은 제목에 있으면 인정 / 문체부·정부는 콘텐츠 실체 단어까지 있어야(관광-only 배제)
    title_any: [한국콘텐츠진흥원, 콘진원, 콘텐츠진흥원, 한국저작권위, 저작권위원회, 게임물관리위원회, 영상물등급위원회]
    title_all_of:
      - [문화체육관광부, 문체부, 정부, 행정안전부, 행안부]
      - [콘텐츠, 게임, 웹툰, 웹소설, 만화, 애니, 저작권, 영상, 방송, 캐릭터, OTT, 음악산업, K-콘텐츠]

  # ═══════════════ 산업 트렌드 (별도 페이지 /trends.html · 위클리 Gcon 스타일) ═══════════════
  # page: trends 인 그룹은 메인이 아니라 트렌드 페이지에 표시. 기관과 무관한 'AI·콘텐츠 산업 동향'.
  # spec 20(높음)이라 기관 기사와 겹쳐도 기관 그룹이 우선 배정됨.
  - id: trend_ai
    label: AI · 생성형AI
    page: trends
    priority: 11
    spec: 20
    queries: [생성형 AI 콘텐츠, AI 콘텐츠 제작, 피지컬 AI, AI 에이전트, 버추얼 휴먼, AI 크리에이터, 생성형 AI 산업, AI 영상 제작]
    require_any: [AI, 인공지능, 생성형, 에이전트, 버추얼, LLM, 챗봇, 딥러닝, 휴머노이드]

  - id: trend_content
    label: 콘텐츠 · 크리에이터
    page: trends
    priority: 12
    spec: 20
    queries: [콘텐츠 산업 트렌드, 웹툰 산업, 웹소설 산업, 크리에이터 이코노미, 숏폼 콘텐츠, K-콘텐츠 수출, OTT 오리지널, IP 비즈니스]
    require_any: [콘텐츠, 웹툰, 웹소설, 크리에이터, 숏폼, OTT, 캐릭터, IP, K-콘텐츠, 유튜브]

  - id: trend_game
    label: 게임 · e스포츠
    page: trends
    priority: 13
    spec: 20
    queries: [게임 산업 트렌드, 인디게임, e스포츠 산업, 게임 신작 출시, 게임 수출, 콘솔 게임]
    require_any: [게임, e스포츠, 이스포츠, 인디게임, 콘솔, 스팀, MMORPG, 신작]

  - id: trend_insight
    label: 전망 · 심층분석
    page: trends
    priority: 14
    spec: 20
    queries: [AI 산업 전망, 콘텐츠 산업 전망, 생성형 AI 전망, AI 트렌드 분석, 콘텐츠 산업 리포트, K콘텐츠 전망, AI 산업 분석]
    # 제목에 (분석/전망 각도) AND (AI·콘텐츠 산업) 둘 다 → 야구전망·원전분석 등 배제
    title_all_of:
      - [전망, 분석, 리포트, 인사이트, 심층, 트렌드, 전략, 향후, 미래, 진단, 조망, 해부]
      - [AI, 인공지능, 생성형, 콘텐츠, 게임, 웹툰, 웹소설, 애니, 만화, 크리에이터, OTT, 캐릭터, 미디어, 엔터, 메타버스, 로봇, 반도체, 빅테크, 테크, K-콘텐츠, 영상, 웹3, 애플, 엔비디아, 오픈AI, 챗GPT, 구글, 딥시크, 챗봇]

  - id: trend_global
    label: 글로벌 동향
    page: trends
    priority: 15
    spec: 20
    queries: [중국 AI 산업, 미국 AI 콘텐츠, 글로벌 콘텐츠 시장, 할리우드 AI, 일본 콘텐츠 산업, 실리콘밸리 AI]
    # 제목에 (지역/글로벌) AND (AI·콘텐츠·테크) 둘 다 → 미국 주식·해외연예 등 배제
    title_all_of:
      - [중국, 미국, 일본, 유럽, 글로벌, 해외, 실리콘밸리, 할리우드, 빅테크]
      - [AI, 인공지능, 생성형, 콘텐츠, 게임, 웹툰, 애니, 크리에이터, OTT, 미디어, 엔터, 로봇, 반도체, 빅테크, 스타트업, 테크, 앱, 모델, 챗봇, 애플, 엔비디아, 오픈AI, 챗GPT, 구글, 딥시크]
