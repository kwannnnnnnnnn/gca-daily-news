name: daily-news

on:
  schedule:
    # KST = UTC+9. GitHub 예약은 best-effort라 혼잡 시각일수록 밀린다.
    # ★정각(:00)·00:00 UTC는 전 세계 예약이 몰려 최대 2시간까지 지연 → 반드시 피할 것.
    #  (실측: 00:00 UTC 회차만 매일 111~125분 지연, 06/08:00 UTC는 10~30분)
    # → 어정쩡한 분(:05/:35)으로 비켜서고, 업무시간 30분 간격 예약해 한두 회차가 씹혀도 다음이 메꾼다.
    #   (GitHub 예약은 지연뿐 아니라 '무발화'도 잦음 — 2026-08-05 실측: 매시간(:35)만으로는
    #    12:35 회차 누락에 이어 15:35·16:35 두 회차가 연속 무발화, 17:35분도 46분 지연.
    #    수집 자체는 30시간 창이라 데이터 유실은 없지만 사이트 갱신 체감 공백이 커서 30분 간격으로 촘촘히.)
    #   08:05~17:35 KST 30분 간격 = UTC 23:05·23:35 및 00:05~08:35(매 :05·:35)
    - cron: "5,35 23 * * *"           # 08:05·08:35 KST
    - cron: "5,35 0,1,2,3,4,5,6,7,8 * * *"   # 09:05~17:35 KST 30분 간격
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write            # 생성물(docs) 커밋/푸시용

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Collect → process → render
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          # NAVER API HUB(NCP) — 구 검색 API 2026-07-31 종료 후속. 있으면 자동 전환.
          NCP_API_KEY_ID: ${{ secrets.NCP_API_KEY_ID }}
          NCP_API_KEY: ${{ secrets.NCP_API_KEY }}
        run: python main.py

      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "chore: 뉴스 자동 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          # 실행이 겹치면 push가 밀린다(! [rejected] fetch first).
          # 리베이스 후 재시도하고, 생성물 충돌은 이번 실행분(-X theirs)을 채택한다.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push 성공(시도 $i)"
              exit 0
            fi
            echo "push 충돌 — 리베이스 후 재시도($i)"
            git pull --rebase -X theirs origin main || git rebase --abort || true
            sleep $(( (RANDOM % 10) + 5 ))
          done
          echo "::error::5회 재시도 후에도 push 실패"
          exit 1
