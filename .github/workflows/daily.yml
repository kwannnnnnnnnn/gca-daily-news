name: daily-news

on:
  schedule:
    # KST = UTC+9. GitHub 예약은 best-effort라 혼잡 시각일수록 밀린다.
    # ★정각(:00)·00:00 UTC는 전 세계 예약이 몰려 최대 2시간까지 지연 → 반드시 피할 것.
    #  (실측: 00:00 UTC 회차만 매일 111~125분 지연, 06/08:00 UTC는 10~30분)
    # → 어정쩡한 분(:35)으로 비켜서고, 업무시간 매시간 예약해 한 회차가 씹혀도 다음이 메꾼다.
    #   (GitHub 예약은 지연뿐 아니라 '무발화'도 잦음 — 2026-08-05 12:35분 회차 실측 누락)
    #   08:35~17:35 KST 매시간 = UTC 23:35 및 00:35~08:35
    - cron: "35 23 * * *"          # 08:35 KST
    - cron: "35 0,1,2,3,4,5,6,7,8 * * *"   # 09:35~17:35 KST 매시간
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write            # 생성물(docs) 커밋/푸시용

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Collect → process → render
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python main.py

      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 뉴스 자동 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi
